name: Build and release songbook

on:
  push:
    tags:
      - "r*" # For example: v1.0.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Build songbook PDF with ChordPro
        run: |
          docker run --rm \
            --entrypoint chordpro \
            -v "${{ github.workspace }}:/workdir" \
            -w /workdir \
            chordpro/chordpro \
            --config=config.json \
            --file=songbook.txt \
            -o Zpevnik.pdf

      - name: Verify PDF was created
        run: test -s Zpevnik.pdf

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Zpevnik.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
