name: Build and release songbook

on:
  push:
    tags:
      - "r*" # For example: v1.0.0

permissions:
  contents: write

env:
  TARGET: songbook

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            chordpro \
            ninja-build \
            python3

      - name: Show dependency versions
        run: |
          python3 --version
          ninja --version
          chordpro --version

      - name: Configure build
        run: python3 configure.py

      - name: Build songbook
        run: ninja "Zpevnik.pdf"

      - name: Verify generated PDF
        run: test -f "_build/Zpevnik.pdf"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "_build/Zpevnik.pdf#Zpevnik.pdf" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
